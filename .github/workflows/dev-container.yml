name: "Build: Dev Container"

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version from latest release tag
        id: version
        run: |
          TAG=$(git tag --sort=-v:refname | head -1)
          TAG=${TAG:-v0.0.0}
          BASE="${TAG#v}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "app_version=${BASE}-dev.${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set lower case image name
        run: echo "IMAGE_NAME_LC=${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ github.repository }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (attempt 1)
        id: build_push_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            COMMIT_SHA=${{ github.sha }}
            IMAGE_TAG=dev
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Craft - Dev Build
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push (retry)
        if: steps.build_push_attempt_1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            COMMIT_SHA=${{ github.sha }}
            IMAGE_TAG=dev
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Craft - Dev Build
            org.opencontainers.image.revision=${{ github.sha }}
